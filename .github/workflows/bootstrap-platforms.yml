name: Bootstrap Flutter Platforms

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-platforms
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.3"

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Generate Android, Web, and Windows runners
        run: |
          if [ -d android ] && [ -d web ] && [ -d windows ]; then
            echo "Platform runners already exist."
            exit 0
          fi
          flutter create . --platforms=android,web,windows

      - name: Commit generated platform runners
        run: |
          if git diff --quiet; then
            echo "No platform changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android web windows
          git commit -m "chore: add Flutter Android web windows runners [skip ci]"
          git push
