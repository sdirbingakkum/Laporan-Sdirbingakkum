name: One-shot Dart formatter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: startsWith(github.event.head_commit.message, 'chore: add one-shot Dart formatter')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
          pub-cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format changed report file
        run: dart format lib/features/statistics/presentation/statistics_page.dart

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- lib/features/statistics/presentation/statistics_page.dart; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/statistics/presentation/statistics_page.dart
          git commit -m "chore: format report statistics page"
          git push
