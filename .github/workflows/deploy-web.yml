name: Build Flutter Web Artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-web-build
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.3"

jobs:
  build-web:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Ensure Web runner
        run: flutter create . --platforms=web

      - name: Dependencies
        run: flutter pub get

      - name: Validate publishable key
        env:
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Build Web
        env:
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build web --release \
            --base-href "/Laporan-Sdirbingakkum/" \
            --dart-define=SUPABASE_URL=https://ybepaqmrrgsaeqnqrsrf.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$KEY"

      - name: SPA fallback
        run: cp build/web/index.html build/web/404.html

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-release
          path: build/web
          if-no-files-found: error
          retention-days: 7
