name: One-time Dart Format Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-and-commit:
    if: "!contains(github.event.head_commit.message, '[skip format-fix]')"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
          pub-cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format Dart
        run: dart format lib test

      - name: Commit formatted Dart
        run: |
          if git diff --quiet -- lib test; then
            echo "No formatting changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: apply Dart formatter [skip format-fix]"
          git push
