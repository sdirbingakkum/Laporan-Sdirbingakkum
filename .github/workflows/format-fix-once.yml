name: Format Fix Once

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: dart format lib test
      - name: Commit formatted files and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/format-fix-once.yml
          git add lib test .github/workflows/format-fix-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format Dart sources"
          git push
