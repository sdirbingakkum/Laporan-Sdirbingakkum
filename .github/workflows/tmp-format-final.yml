name: Temporary Flutter Format

on:
  push:
    branches: [tmp/format-final-ui]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    env:
      FLUTTER_VERSION: "3.47.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Format
        run: dart format lib test
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "NO_FORMAT_CHANGES=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "chore: apply Dart formatter"
          git push
