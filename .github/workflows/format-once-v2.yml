name: One-shot Dart Format V2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-v2]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: dart format lib test
      - name: Commit formatted sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "chore: apply Dart formatter [format-applied-v2]"
          git push
