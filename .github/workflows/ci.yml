# Final CI gate for responsive menu release
name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.3"

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=show lib/features/statistics/presentation/statistics_page.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

