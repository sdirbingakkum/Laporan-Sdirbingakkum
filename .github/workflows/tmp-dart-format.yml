name: Temporary Dart Format Diff

on:
  push:
    branches:
      - "tmp/format-widget-test"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.3"

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Show formatter diff
        shell: bash
        run: |
          dart format test/widget_test.dart
          git diff --no-ext-diff --unified=999 -- test/widget_test.dart
