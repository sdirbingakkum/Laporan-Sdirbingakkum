name: Temporary PR #1 Visual Snapshot

on:
  push:
    branches: [feat/supabase-report-data-v2]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
          pub-cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Prepare golden directory
        run: mkdir -p test/goldens
      - name: Render snapshots
        run: flutter test --update-goldens test/_pr1_visual_snapshot_test.dart
      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: pr1-visual-snapshots
          path: test/goldens/pr1_*.png
          if-no-files-found: error
