name: Temporary Report Formatter

on:
  push:
    branches: [feat/supabase-report-data-v2]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
          pub-cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib test

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: format report tests [skip ci]"
          git push origin HEAD:feat/supabase-report-data-v2
